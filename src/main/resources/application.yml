spring:
  application:
    name: financeflow

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 500ms

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

financeflow:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_SECONDS:3600}s
  reports:
    cache-ttl: 300s
  time:
    # Fuso usado para definir o "hoje" das regras de negocio (saldo ate a data).
    zone: ${APP_TIME_ZONE:America/Sao_Paulo}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Redis e cache opcional: indisponibilidade degrada desempenho, nao o servico.
    redis:
      enabled: false
