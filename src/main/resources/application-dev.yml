# Perfil de desenvolvimento local. Postgres e Redis sobem pelo docker-compose.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeflow}
    username: ${DB_USERNAME:financeflow}
    password: ${DB_PASSWORD:change_me}

logging:
  level:
    com.financeflow: DEBUG
    org.hibernate.SQL: warn

financeflow:
  reports:
    # Expõe X-Cache: HIT|MISS|BYPASS para evidenciar o comportamento do cache.
    expose-cache-header: true

springdoc:
  swagger-ui:
    enabled: true
